name: checks

on:
  push:
  pull_request:

jobs:
  flight-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build flight model tests
        run: |
          cmake -S Tests/FlightModel -B Tests/FlightModel/build -DCMAKE_BUILD_TYPE=Release
          cmake --build Tests/FlightModel/build
      - name: Run flight model tests
        run: ./Tests/FlightModel/build/FlightModelTests

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Flight pacing report
        run: python Tools/layout_report.py
      - name: Greybox builder dry run
        run: python Tools/Unreal/build_greybox_m0.py --dry-run
